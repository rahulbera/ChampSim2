name: Run Tests

on:
  push:
    branches:
      - master
      - develop
    paths-ignore:
      - '.gitignore'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/*.yml'
      # re-include current file to not be excluded
      - '!.github/workflows/test.yml'

  pull_request:
    branches:
      - master
      - develop
    paths-ignore:
      - '.gitignore'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/*.yml'
      # re-include current file to not be excluded
      - '!.github/workflows/test.yml'

jobs:
  cpp:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    env:
      CXX: ${{ matrix.config.cxx }}

    strategy:
      fail-fast: false
      matrix:
        config:
        # GCC-9
        - {
            name: "Ubuntu 22.04 GCC 9",
            os: ubuntu-22.04,
            cxx: "g++-9",
          }

        # GCC-10
        - {
            name: "Ubuntu 22.04 GCC 10",
            os: ubuntu-22.04,
            cxx: "g++-10",
          }

        # GCC-11
        - {
            name: "Ubuntu 22.04 GCC 11",
            os: ubuntu-22.04,
            cxx: "g++-11",
          }

        # GCC-12
        - {
            name: "Ubuntu 22.04 GCC 12",
            os: ubuntu-22.04,
            cxx: "g++-12",
          }
        - {
            name: "Ubuntu 24.04 GCC 12",
            os: ubuntu-24.04,
            cxx: "g++-12",
          }

        # GCC-13
        - {
            name: "Ubuntu 24.04 GCC 13",
            os: ubuntu-24.04,
            cxx: "g++-13",
            coverage: true,
          }

        # GCC-14
        - {
            name: "Ubuntu 24.04 GCC 14",
            os: ubuntu-24.04,
            cxx: "g++-14",
          }

        # Clang-12
        - {
            name: "Ubuntu 22.04 Clang 12",
            os: ubuntu-22.04,
            cxx: "clang++-12",
          }

        # Clang-13
        - {
            name: "Ubuntu 22.04 Clang 13",
            os: ubuntu-22.04,
            cxx: "clang++-13",
          }

        # Clang-14
        - {
            name: "Ubuntu 22.04 Clang 14",
            os: ubuntu-22.04,
            cxx: "clang++-14",
          }

        # Clang-15
        - {
            name: "Ubuntu 22.04 Clang 15",
            os: ubuntu-22.04,
            cxx: "clang++-15",
          }

        # Clang-16
        - {
            name: "Ubuntu 24.04 Clang 16",
            os: ubuntu-24.04,
            cxx: "clang++-16",
          }

        # Clang-17
        - {
            name: "Ubuntu 24.04 Clang 17",
            os: ubuntu-24.04,
            cxx: "clang++-17",
          }

        # Clang-18
        - {
            name: "Ubuntu 24.04 Clang 18",
            os: ubuntu-24.04,
            cxx: "clang++-18",
          }

        # AppleClang
        - {
            name: "macOS Clang",
            os: macos-latest,
            cxx: "clang++",
          }

        # MSVC 2022
        #- {
        #name: "Windows MSVC 2022",
        #os: windows-latest,
        #cxx: "cl",
        #environment_script: "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Auxiliary/Build/vcvars64.bat",
        #}

    steps:
    - name: Set up basic environment
      if: startsWith(matrix.config.os, 'ubuntu')
      run: |
        sudo apt-get install curl zip unzip tar ${{ matrix.config.cxx }}

    - uses: actions/checkout@v6
      with:
        submodules: 'true'

    - name: Set up vcpkg
      run: |
        vcpkg/bootstrap-vcpkg.sh
        vcpkg/vcpkg install

    - name: Set Coverage Environment
      if: ${{ matrix.config.coverage }}
      run: |
        sudo apt-get install lcov
        echo "CXXFLAGS=--coverage" >> $GITHUB_ENV
        echo "LDFLAGS=--coverage" >> $GITHUB_ENV

    - name: Configure
      run: ./config.sh

    - name: Make
      run: make test/bin/000-test-main

    - name: Run
      run: test/bin/000-test-main --order rand --warn NoAssertions --invisibles

    - name: Capture LCOV
      if: ${{ matrix.config.coverage }}
      run: |
        lcov --capture --no-external \
        --directory . \
        --exclude $(pwd)/.csconfig/\* \
        --exclude $(pwd)/test/\* \
        --exclude $(pwd)/vcpkg_installed/\* \
        --output-file lcov_cpp.info

    - uses: actions/upload-artifact@v7
      if: ${{ matrix.config.coverage }}
      with:
        name: lcov-cpp
        path: lcov_cpp.info

  python:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'true'

    - name: Set up vcpkg
      run: |
        vcpkg/bootstrap-vcpkg.sh
        vcpkg/vcpkg install

    - name: Set up coverage
      run: python -m pip install coverage

    - name: Run
      run: |
        PYTHONPATH=$PYTHONPATH:$(pwd) coverage run --source=config -m unittest discover -v --start-directory='test/python'
        coverage lcov --include=config/\*.py --omit=*/__*__.py -o lcov_python.info

    - uses: actions/upload-artifact@v7
      with:
        name: lcov-python
        path: lcov_python.info

  stats_output:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'true'

    - name: Set up
      run: |
        vcpkg/bootstrap-vcpkg.sh
        vcpkg/vcpkg install
        sudo apt-get install lcov

    - name: Configure
      run: ./config.sh

    - name: Make
      run: make
      env:
        CXXFLAGS: "--coverage"
        LDFLAGS: "--coverage"

    - name: Produce TOML
      run: ./bin/champsim -w5000 -i5000 --toml=test.toml -- <(curl -s https://dpc3.compas.cs.stonybrook.edu/champsim-traces/speccpu/400.perlbench-41B.champsimtrace.xz | xz -dc)

    # Parsing alone only proves the file is well formed, which stayed true
    # through every past change to the printer. Assert the shape too, so that
    # dropping a section or emitting an empty document fails here.
    - name: Validate TOML
      run: |
        python3 - <<'PY'
        import re
        import tomllib
        doc = tomllib.load(open("test.toml", "rb"))
        assert doc["meta"]["schema_version"] == 1, doc["meta"]
        phase = doc["phase"]["simulation"]
        # The whole-run section is opt-in, and [meta] must agree with what was
        # actually emitted; --toml-sim-stats is covered by 099-toml-printer.cc.
        assert doc["meta"]["sim_stats"] is False, doc["meta"]
        assert "sim" not in phase, sorted(phase)
        core = phase["roi"]["core"]["cpu0"]
        assert core["instructions"] > 0, core
        assert core["cycles"] > 0, core
        assert set(core["mispredict"]) == set(core["executed"]), core
        # One lookup per fetched instruction, always classified. The pipeline
        # is not drained between phases, so the lookup count is neither equal to
        # nor bounded by `instructions` and cannot be asserted against it.
        #
        # `dib_lookups` is derived from the other two (inc/core_stats.h), so the
        # sum below is a tautology today -- it is kept as a guard against it
        # ever becoming an independently stored counter. The RATE is the check
        # that bites: it would catch a swapped key or a wrong denominator in the
        # printer, neither of which the sum can see.
        assert core["dib_lookups"] > 0, core
        assert core["dib_lookups"] == core["dib_hits"] + core["dib_misses"], core
        assert abs(core["dib_hit_rate"] - 100 * core["dib_hits"] / core["dib_lookups"]) < 0.01, core
        # Hits need already-DECODED code to run again (the DIB fills at decode,
        # so a cold fetch group misses in its entirety); 400.perlbench loops
        # well inside the ROI, so this holds by thousands of events. dib_misses
        # is deliberately NOT asserted: the ROI starts deep in a hot loop, and
        # the miss count there is a handful of events -- 4 at `-w5000 -i5000`,
        # 0 at `-i2000` -- so guarding it would red this leg on any change to
        # the run length, for a reason unrelated to the document's shape.
        assert core["dib_hits"] > 0, core
        assert phase["roi"]["cache"], "no caches emitted"
        assert phase["roi"]["dram"]["channel0"], "no DRAM channel emitted"
        # Ratios must be real floats -- `nan` is legal and expected, a string or
        # an int is not.
        for key in ("ipc", "mpki", "cyc_wpki", "branch_prediction_accuracy", "dib_hit_rate"):
            assert isinstance(core[key], float), (key, core[key])
        # [config] is the EFFECTIVE configuration -- every key the machine
        # consulted, with the value used -- and [meta] the parameters of this
        # run, so a result file states what produced it.
        meta = doc["meta"]
        assert meta["warmup_instructions"] == 5000, meta
        assert meta["simulation_instructions"] == 5000, meta
        assert meta["trace_version"] == 1, meta
        assert meta["num_cpus"] == 1, meta
        assert "--toml" in meta["command_line"], meta
        # No --config/--set on this leg, so nothing was overridden. An empty
        # table, not a missing one: absence would be indistinguishable from a
        # printer that dropped the section.
        assert doc["config_override"] == {}, doc["config_override"]
        assert meta["config_files"] == "", meta
        # 0x + a 16-hex-digit FNV-1a hash of the effective configuration,
        # leading zeros intact.
        assert re.fullmatch(r"0x[0-9a-f]{16}", meta["build_id"]), meta

        cfg = doc["config"]
        # Only components exist at the root now: there is no configuration file
        # for the document to echo, so an "executable_name" or "block_size" key
        # here would mean the printer had invented one.
        assert set(cfg) == {"cache", "ooo_cpu", "pmem", "ptw", "sim", "vmem"}, sorted(cfg)
        assert cfg["ooo_cpu"]["cpu0"]["branch_predictor"], cfg["ooo_cpu"]["cpu0"]
        assert cfg["ooo_cpu"]["cpu0"]["btb"], cfg["ooo_cpu"]["cpu0"]
        # Module selections are consulted keys like any other, so every cache
        # reports the policy and prefetcher it actually ran with.
        assert cfg["cache"]["cpu0_l1i"]["replacement"], cfg["cache"]["cpu0_l1i"]
        assert cfg["cache"]["cpu0_l1i"]["prefetcher"], cfg["cache"]["cpu0_l1i"]
        # The whole point of lower-casing component names the same way in both
        # sections: a consumer can join a cache's configuration to its stats.
        assert set(cfg["cache"]) == set(phase["roi"]["cache"]), (sorted(cfg["cache"]), sorted(phase["roi"]["cache"]))
        assert set(cfg["ooo_cpu"]) == set(phase["roi"]["core"]), (sorted(cfg["ooo_cpu"]), sorted(phase["roi"]["core"]))

        print("TOML document validated")
        PY

    # The runtime configuration path: a file, an overriding --set, and the
    # provenance record. Streams the trace again -- process substitution caches
    # nothing, so this is a second download.
    - name: Runtime configuration overrides
      run: |
        ./bin/champsim -w5000 -i5000 --config configs/sample.toml --set ooo_cpu.cpu0.rob_size=256 \
          --toml override.toml -- <(curl -s https://dpc3.compas.cs.stonybrook.edu/champsim-traces/speccpu/400.perlbench-41B.champsimtrace.xz | xz -dc)
        python3 - <<'PY'
        import tomllib
        doc = tomllib.load(open("override.toml", "rb"))
        ov = doc["config_override"]
        # --set came AFTER --config, so it wins over the file's 512.
        assert ov["ooo_cpu.cpu0.rob_size"] == 256, ov
        # Untouched file keys apply as written.
        assert ov["cache.cpu0_l1d.sets"] == 128, ov
        assert doc["meta"]["config_files"] == "configs/sample.toml", doc["meta"]
        print("runtime configuration validated")
        PY

    # Selecting the perfect pair makes the swap's EFFECT structural: both
    # oracles read the trace's own outcome/target, so total_mispredicts is 0
    # by construction -- while the inc/defs.h default pair
    # (hashed_perceptron + basic_btb) mispredicts. Two
    # REAL predictors can tie on a 5000-instruction window (bimodal and gshare
    # do, at 41), so real ones cannot carry this assertion. Module-knob
    # consumption is covered by the sample.toml step above (basic_btb's
    # geometry table with basic_btb selected).
    - name: Runtime module selection
      run: |
        ./bin/champsim -w5000 -i5000 --set ooo_cpu.cpu0.branch_predictor=perfect_branch \
          --set ooo_cpu.cpu0.btb=perfect_btb \
          --toml modsel.toml -- <(curl -s https://dpc3.compas.cs.stonybrook.edu/champsim-traces/speccpu/400.perlbench-41B.champsimtrace.xz | xz -dc)
        python3 - <<'PY'
        import tomllib
        doc = tomllib.load(open("modsel.toml", "rb"))
        ov = doc["config_override"]
        assert ov["ooo_cpu.cpu0.branch_predictor"] == "perfect_branch", ov
        assert ov["ooo_cpu.cpu0.btb"] == "perfect_btb", ov
        # [config] is the EFFECTIVE configuration, so it shows what ran.
        assert doc["config"]["ooo_cpu"]["cpu0"]["branch_predictor"] == "perfect_branch", doc["config"]["ooo_cpu"]["cpu0"]
        core = doc["phase"]["simulation"]["roi"]["core"]["cpu0"]
        base = tomllib.load(open("test.toml", "rb"))["phase"]["simulation"]["roi"]["core"]["cpu0"]
        assert base["total_mispredicts"] > 0, base["mispredict"]
        assert core["total_mispredicts"] == 0, core["mispredict"]
        print("runtime module selection validated")
        PY

    # A statistics document is a configuration source: --config on a previous
    # run's --toml output must reproduce that run. This is the provenance
    # claim the document makes, so it is checked end-to-end rather than only
    # at the store's unit level (098-runtime-config.cc).
    - name: Reproduce a run from its own statistics document
      run: |
        ./bin/champsim -w5000 -i5000 --config test.toml --toml repro.toml \
          -- <(curl -s https://dpc3.compas.cs.stonybrook.edu/champsim-traces/speccpu/400.perlbench-41B.champsimtrace.xz | xz -dc)
        python3 - <<'PY'
        import math
        import tomllib
        first = tomllib.load(open("test.toml", "rb"))
        again = tomllib.load(open("repro.toml", "rb"))

        # An undefined ratio is emitted as a real `nan`, and nan != nan -- so a
        # plain == on these documents reports a difference where there is none.
        def differences(lhs, rhs, path=""):
            if isinstance(lhs, dict) and isinstance(rhs, dict):
                for key in sorted(set(lhs) | set(rhs)):
                    if key not in lhs or key not in rhs:
                        yield f"{path}.{key} is present in only one document"
                    else:
                        yield from differences(lhs[key], rhs[key], f"{path}.{key}")
            elif isinstance(lhs, float) and isinstance(rhs, float) and math.isnan(lhs) and math.isnan(rhs):
                return
            elif lhs != rhs:
                yield f"{path}: {lhs!r} != {rhs!r}"

        # The machine is identical: same effective configuration, same id.
        assert not list(differences(first["config"], again["config"])), list(differences(first["config"], again["config"]))
        assert again["meta"]["build_id"] == first["meta"]["build_id"], (again["meta"], first["meta"])
        # And so are the results it produced.
        assert not list(differences(first["phase"], again["phase"])), list(differences(first["phase"], again["phase"]))
        # Every key came from the document, so all of them are overrides now --
        # the file did set them.
        assert again["config_override"], again["config_override"]
        print("statistics-document round trip validated")
        PY

    # --knobs is documented as the authoritative list of what a binary
    # accepts, so it has to be machine-readable: a stray warning on stdout
    # (the VMEM one fires during the probe) used to make it unparseable.
    - name: --knobs emits a usable configuration file
      run: |
        ./bin/champsim --knobs > knobs.toml
        python3 -c "import tomllib; d = tomllib.load(open('knobs.toml','rb')); assert sorted(d) == ['cache','ooo_cpu','pmem','ptw','sim','vmem'], sorted(d)"
        # And what it emits is accepted straight back as configuration.
        ./bin/champsim -w5000 -i5000 --config knobs.toml \
          -- <(curl -s https://dpc3.compas.cs.stonybrook.edu/champsim-traces/speccpu/400.perlbench-41B.champsimtrace.xz | xz -dc)
        echo "--knobs round trip validated"

    - name: Reject an unknown module name
      run: |
        set +e
        message=$(./bin/champsim -w5000 -i5000 --set ooo_cpu.cpu0.btb=no_such_btb -- /dev/null 2>&1)
        status=$?
        set -e
        echo "$message"
        test "$status" -ne 0 || { echo "expected an unknown module to exit non-zero"; exit 1; }
        echo "$message" | grep -q "valid btb modules" || { echo "exited non-zero, but not because of the module registry"; exit 1; }

    - name: Reject an unknown runtime key
      run: |
        set +e
        message=$(./bin/champsim -w5000 -i5000 --set pmem.tCAS=24 -- /dev/null 2>&1)
        status=$?
        set -e
        echo "$message"
        test "$status" -ne 0 || { echo "expected an unknown key to exit non-zero"; exit 1; }
        echo "$message" | grep -q "did you mean 'pmem.tcas'" || { echo "exited non-zero, but not because of the unknown-key guard"; exit 1; }

    # Asserting the message, not just a non-zero exit: almost anything makes
    # this command fail, and a guard that passes for the wrong reason is worse
    # than no guard.
    - name: Reject the removed --json option
      run: |
        set +e
        message=$(./bin/champsim -w5000 -i5000 --json=test.json -- /dev/null 2>&1)
        status=$?
        set -e
        echo "$message"
        test "$status" -ne 0 || { echo "expected --json to exit non-zero"; exit 1; }
        echo "$message" | grep -q -- "--json has been removed" || { echo "exited non-zero, but not because of the --json guard"; exit 1; }

    - name: Capture LCOV
      run: |
        lcov --capture --no-external \
        --directory . \
        --include $(pwd)/src/toml_printer.cc \
        --include $(pwd)/src/runtime_config.cc \
        --include $(pwd)/inc/runtime_config.h \
        --include $(pwd)/src/json_printer.cc \
        --include $(pwd)/inc/stats_printer.h \
        --output-file lcov_stats.info

    - uses: actions/upload-artifact@v7
      with:
        name: lcov-stats
        path: lcov_stats.info

  upload_coveralls:
    runs-on: ubuntu-latest
    needs: [cpp, python, stats_output]
    steps:
    - uses: actions/checkout@v6

    - name: Set Coverage Environment
      run: sudo apt-get install lcov

    - uses: actions/download-artifact@v8.0.0
      with:
        name: lcov-cpp

    - uses: actions/download-artifact@v8.0.0
      with:
        name: lcov-python

    - uses: actions/download-artifact@v8.0.0
      with:
        name: lcov-stats

    - name: Merge coverage
      run: lcov --add-tracefile lcov_cpp.info --add-tracefile lcov_python.info --add-tracefile lcov_stats.info --output-file lcov.info

    - name: Coveralls
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: lcov.info

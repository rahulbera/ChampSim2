# BMT-2/2 scenario: C_phys=2 physical slots, C_virt=2 virtual threads.
#
# Overlay on configs/sample.toml. --config may repeat and is applied in
# command-line order (last definition of a key wins), so apply this AFTER
# sample.toml:
#
#   ./bin/champsim --config configs/sample.toml --config configs/bmt-2-2.toml \
#     --trace-version=2 -w 1000000 -i 3000000 -- \
#     sqlite.champsim2 omnetpp.champsim2
#
# The C_virt scan (BMT-2/2, 2/3, 2/4, bmt-design.md §0/§9) fixes C_phys=2 and
# walks C_virt over the four v2 traces (sqlite/omnetpp/llvm/vpr) in order. 2/2
# is the identity-fill arm (C_virt == C_phys): a long-latency load still
# triggers swap-out, but LRR finds only the same thread suspended and re-binds
# it, so the swap collapses to flush-and-self-rerun (flush-on-miss, the
# bmt-design.md §B.1 baseline) with no thread-level hiding to gain. It isolates
# the flush cost from the multi-thread hiding the 2/3 and 2/4 arms add. The
# physical register file is the shared core pool (sample.toml default 128, as in
# lock-4's N=2), so only the two bound threads' committed + in-flight registers
# are live at once; rsave releases a swapped-out thread's mappings and rrestore
# re-allocates them fresh.
#
# bmt_switch = "instant" models the swap atomically (no slot stall); the firmware
# ~60-cycle arm is the A/B comparison knob, not this baseline.

[ooo_cpu.cpu0]
num_contexts = 2
num_virtual_threads = 2
# V2.2 elastic ROB partition: a swapped-out thread's ROB is flushed empty, so it
# stops counting toward `active` and the remaining slot reclaims the quota.
rob_partition = "active"

[ooo_cpu.cpu0.bmt]
enabled = true
swap_enabled = true
switch = "instant"
